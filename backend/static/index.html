<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q-Optima | Quantum Portfolio Optimization Platform</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: '#090D16',
            surface: '#111726',
            'surface-border': '#1E293B'
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['Fira Code', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { background-color: #090D16; color: #F8FAFC; font-family: 'Inter', sans-serif; }
    .glass-panel {
      background: rgba(17, 23, 38, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.5) 0%, rgba(15, 23, 42, 0.6) 100%);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.07);
    }
    .glass-card:hover {
      border-color: rgba(6, 182, 212, 0.4);
      box-shadow: 0 0 20px -5px rgba(6, 182, 212, 0.2);
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #090D16; }
    ::-webkit-scrollbar-thumb { background: #1E293B; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #06B6D4; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-cyan-500/30 selection:text-cyan-200">

  <!-- HEADER NAVBAR -->
  <header className="sticky top-0 z-50 glass-panel border-b border-surface-border">
    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div className="flex items-center justify-between h-16">
        
        <!-- Logo -->
        <div onclick="switchTab('landing')" class="flex items-center space-x-3 cursor-pointer group">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 via-blue-600 to-purple-600 p-[1px] shadow-lg shadow-cyan-500/20">
            <div class="w-full h-full bg-[#090D16] rounded-[11px] flex items-center justify-center">
              <i data-lucide="cpu" class="w-5 h-5 text-cyan-400"></i>
            </div>
          </div>
          <div>
            <span class="text-lg font-bold bg-gradient-to-r from-white via-slate-200 to-cyan-400 bg-clip-text text-transparent">
              Q-Optima
            </span>
            <span class="block text-[10px] uppercase tracking-widest text-cyan-400 font-mono">
              Qiskit QAOA Engine
            </span>
          </div>
        </div>

        <!-- Navigation Tabs -->
        <nav class="hidden lg:flex items-center space-x-1" id="desktop-nav">
          <!-- Rendered dynamically -->
        </nav>

        <!-- Status -->
        <div class="flex items-center space-x-2 px-3 py-1 rounded-full bg-slate-900/80 border border-surface-border text-xs">
          <span class="flex h-2 w-2 relative">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
          </span>
          <span class="text-[11px] font-mono text-slate-300">FastAPI + Qiskit 1.0</span>
        </div>

      </div>
    </div>

    <!-- Mobile Scroll Nav -->
    <div class="lg:hidden flex overflow-x-auto px-4 py-2 border-t border-surface-border space-x-1" id="mobile-nav">
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full" id="app-content">
    <!-- Dynamic tab content injected here -->
  </main>

  <!-- FOOTER -->
  <footer class="border-t border-surface-border bg-[#090D16] py-8 mt-12 text-slate-400">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row justify-between items-center text-xs">
      <div class="flex items-center space-x-2">
        <i data-lucide="cpu" class="w-4 h-4 text-cyan-400"></i>
        <span class="font-bold text-white">Q-Optima Quantum Portfolio Platform</span>
      </div>
      <div class="font-mono text-slate-500 mt-2 sm:mt-0">
        Qiskit v1.0+ • FastAPI v1.0 • Finance & Wealth Tech
      </div>
    </div>
  </footer>

  <!-- APPLICATION LOGIC SCRIPT -->
  <script>
    const NAV_ITEMS = [
      { id: 'landing', label: 'Overview', icon: 'cpu' },
      { id: 'optimizer', label: 'Optimizer', icon: 'sliders' },
      { id: 'universe', label: 'Stock Universe', icon: 'globe' },
      { id: 'simulation', label: 'Quantum Simulation', icon: 'activity' },
      { id: 'circuit', label: 'Circuit Viewer', icon: 'layers' },
      { id: 'results', label: 'Results', icon: 'bar-chart-3' },
      { id: 'frontier', label: 'Efficient Frontier', icon: 'trending-up' },
      { id: 'risk', label: 'Risk Analysis', icon: 'shield-alert' },
      { id: 'analytics', label: 'Analytics', icon: 'pie-chart' },
      { id: 'comparison', label: 'Comparison', icon: 'git-compare' },
      { id: 'user-guide', label: 'User Guide', icon: 'book-open' }
    ];

    let currentTab = 'landing';
    let selectedTickers = ['AAPL', 'MSFT', 'NVDA', 'GOOGL', 'AMZN'];
    let investmentAmount = 10000;
    let budgetK = 3;
    let riskFactor = 0.5;
    let pLayers = 2;
    let stockUniverse = [];
    let latestResult = null;
    let chartInstances = {};

    async function initApp() {
      renderNav();
      fetchUniverse();
      switchTab('landing');
    }

    function renderNav() {
      const desktopNav = document.getElementById('desktop-nav');
      const mobileNav = document.getElementById('mobile-nav');

      desktopNav.innerHTML = NAV_ITEMS.map(item => `
        <button onclick="switchTab('${item.id}')" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-lg text-xs font-medium transition-all ${
          currentTab === item.id 
            ? 'bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 font-semibold shadow-sm' 
            : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/40'
        }">
          <i data-lucide="${item.icon}" class="w-3.5 h-3.5"></i>
          <span>${item.label}</span>
        </button>
      `).join('');

      mobileNav.innerHTML = NAV_ITEMS.map(item => `
        <button onclick="switchTab('${item.id}')" class="flex items-center space-x-1 whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-medium ${
          currentTab === item.id ? 'bg-cyan-500/10 text-cyan-400 border border-cyan-500/30' : 'text-slate-400'
        }">
          <i data-lucide="${item.icon}" class="w-3.5 h-3.5"></i>
          <span>${item.label}</span>
        </button>
      `).join('');

      lucide.createIcons();
    }

    function toggleTooltip(id) {
      const el = document.getElementById(id);
      if (!el) return;
      const isHidden = el.classList.contains('hidden');
      document.querySelectorAll('[id^="tt-"]').forEach(t => t.classList.add('hidden'));
      if (isHidden) {
        el.classList.remove('hidden');
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        document.querySelectorAll('[id^="tt-"]').forEach(t => t.classList.add('hidden'));
      }
    });

    async function fetchUniverse() {
      try {
        const res = await fetch('/api/stocks/universe');
        const data = await res.json();
        stockUniverse = data.universe;
      } catch (err) {
        console.error(err);
      }
    }

    function switchTab(tabId) {
      currentTab = tabId;
      renderNav();
      const content = document.getElementById('app-content');

      if (tabId === 'landing') renderLanding(content);
      else if (tabId === 'optimizer') renderOptimizer(content);
      else if (tabId === 'universe') renderUniverse(content);
      else if (tabId === 'simulation') renderSimulation(content);
      else if (tabId === 'circuit') renderCircuit(content);
      else if (tabId === 'results') renderResults(content);
      else if (tabId === 'frontier') renderFrontier(content);
      else if (tabId === 'risk') renderRisk(content);
      else if (tabId === 'analytics') renderAnalytics(content);
      else if (tabId === 'comparison') renderComparison(content);
      else if (tabId === 'user-guide') renderUserGuide(content);

      lucide.createIcons();
    }

    // LANDING PAGE
    function renderLanding(container) {
      container.innerHTML = `
        <div class="space-y-16 py-4">
          <section class="relative overflow-hidden rounded-3xl glass-panel p-8 sm:p-12 border border-surface-border">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
              <div class="lg:col-span-7 space-y-6">
                <div class="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 text-xs font-mono">
                  <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
                  <span>Qiskit QAOA + Dicke State Initialization</span>
                </div>
                <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight text-white leading-tight">
                  Optimize Stock Portfolios with <br/>
                  <span class="bg-gradient-to-r from-cyan-400 via-blue-400 to-purple-500 bg-clip-text text-transparent">
                    Quantum Computing
                  </span>
                </h1>
                <p class="text-slate-300 text-sm sm:text-base leading-relaxed">
                  Eliminate infeasible portfolio samples using zero-infeasibility Dicke state preparation, XY mixers, and CVaR weighted Ising Hamiltonians implemented in Qiskit.
                </p>
                <div class="flex flex-wrap gap-4 pt-2">
                  <button onclick="switchTab('optimizer')" class="flex items-center space-x-2 px-6 py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-semibold text-sm shadow-lg shadow-cyan-500/30 hover:opacity-90">
                    <span>Launch Optimizer</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                  </button>
                  <button onclick="switchTab('circuit')" class="flex items-center space-x-2 px-6 py-3 rounded-xl bg-slate-900 border border-surface-border text-slate-200 text-sm font-medium hover:bg-slate-800">
                    <i data-lucide="layers" class="w-4 h-4 text-cyan-400"></i>
                    <span>View QAOA Circuit</span>
                  </button>
                </div>
                <!-- KPI Metric Badges with Interactive Tooltips -->
                <div class="pt-6 border-t border-surface-border grid grid-cols-3 gap-4 text-left">
                  
                  <!-- Metric 1: Infeasibility Rate -->
                  <div class="relative group">
                    <div class="text-2xl font-bold font-mono text-cyan-400">0.0%</div>
                    <div class="flex items-center space-x-1 text-xs text-slate-400 mt-0.5">
                      <span>Infeasibility Rate</span>
                      <button 
                        onclick="toggleTooltip('tt-infeasibility')" 
                        aria-label="Info about Infeasibility Rate"
                        class="text-cyan-400 hover:text-cyan-300 focus:outline-none focus:ring-1 focus:ring-cyan-400 rounded-full p-0.5"
                      >
                        <i data-lucide="info" class="w-3.5 h-3.5 animate-pulse"></i>
                      </button>
                    </div>

                    <!-- Tooltip Popup -->
                    <div id="tt-infeasibility" class="hidden group-hover:block absolute bottom-full left-0 mb-3 w-72 sm:w-80 p-4 rounded-2xl glass-panel bg-slate-900/95 border border-cyan-500/40 shadow-2xl shadow-cyan-950/50 backdrop-blur-md z-30 transition-all">
                      <div class="flex justify-between items-center pb-2 border-b border-surface-border mb-2">
                        <span class="text-xs font-bold text-white flex items-center space-x-1.5">
                          <i data-lucide="info" class="w-3.5 h-3.5 text-cyan-400"></i>
                          <span>What is Infeasibility Rate?</span>
                        </span>
                        <span class="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/40">
                          Excellent
                        </span>
                      </div>
                      <p class="text-xs text-slate-300 leading-relaxed mb-2">
                        This metric shows the percentage of generated portfolios that violate the optimization constraints (such as selecting an invalid combination of assets). Lower values are better.
                      </p>
                      <p class="text-xs text-slate-300 leading-relaxed">
                        A value of 0.0% means every generated portfolio satisfies all investment constraints, indicating a stable and reliable optimization process.
                      </p>
                      <div class="mt-3 pt-2 border-t border-surface-border text-[11px] text-emerald-400 font-medium flex items-center space-x-1">
                        <i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i>
                        <span>✓ Excellent — No infeasible portfolios generated.</span>
                      </div>
                      <div class="absolute top-full left-6 -mt-1 w-3 h-3 bg-slate-900 border-r border-b border-cyan-500/40 rotate-45"></div>
                    </div>
                  </div>

                  <!-- Metric 2: CVaR Tail Loss Cut -->
                  <div class="relative group">
                    <div class="text-2xl font-bold font-mono text-purple-400">18.4%</div>
                    <div class="flex items-center space-x-1 text-xs text-slate-400 mt-0.5">
                      <span>CVaR Tail Loss Cut</span>
                      <button 
                        onclick="toggleTooltip('tt-cvar')" 
                        aria-label="Info about CVaR Tail Loss Cut"
                        class="text-purple-400 hover:text-purple-300 focus:outline-none focus:ring-1 focus:ring-purple-400 rounded-full p-0.5"
                      >
                        <i data-lucide="info" class="w-3.5 h-3.5 animate-pulse"></i>
                      </button>
                    </div>

                    <!-- Tooltip Popup -->
                    <div id="tt-cvar" class="hidden group-hover:block absolute bottom-full left-0 mb-3 w-72 sm:w-80 p-4 rounded-2xl glass-panel bg-slate-900/95 border border-purple-500/40 shadow-2xl shadow-purple-950/50 backdrop-blur-md z-30 transition-all">
                      <div class="flex justify-between items-center pb-2 border-b border-surface-border mb-2">
                        <span class="text-xs font-bold text-white flex items-center space-x-1.5">
                          <i data-lucide="info" class="w-3.5 h-3.5 text-purple-400"></i>
                          <span>What is CVaR Tail Loss Cut?</span>
                        </span>
                        <span class="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/40">
                          Excellent
                        </span>
                      </div>
                      <p class="text-xs text-slate-300 leading-relaxed mb-2">
                        CVaR (Conditional Value at Risk) measures expected losses during the worst market scenarios.
                      </p>
                      <p class="text-xs text-slate-300 leading-relaxed">
                        This value indicates how much the optimization reduced potential downside risk compared with the baseline portfolio. Higher percentages indicate better protection during market downturns.
                      </p>
                      <div class="mt-3 pt-2 border-t border-surface-border text-[11px] text-emerald-400 font-medium flex items-center space-x-1">
                        <i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i>
                        <span>✓ Better downside risk protection.</span>
                      </div>
                      <div class="absolute top-full left-6 -mt-1 w-3 h-3 bg-slate-900 border-r border-b border-purple-500/40 rotate-45"></div>
                    </div>
                  </div>

                  <!-- Metric 3: Optimality Gap -->
                  <div class="relative group">
                    <div class="text-2xl font-bold font-mono text-emerald-400">2.8%</div>
                    <div class="flex items-center space-x-1 text-xs text-slate-400 mt-0.5">
                      <span>Optimality Gap</span>
                      <button 
                        onclick="toggleTooltip('tt-gap')" 
                        aria-label="Info about Optimality Gap"
                        class="text-emerald-400 hover:text-emerald-300 focus:outline-none focus:ring-1 focus:ring-emerald-400 rounded-full p-0.5"
                      >
                        <i data-lucide="info" class="w-3.5 h-3.5 animate-pulse"></i>
                      </button>
                    </div>

                    <!-- Tooltip Popup -->
                    <div id="tt-gap" class="hidden group-hover:block absolute bottom-full right-0 sm:right-auto sm:left-0 mb-3 w-72 sm:w-80 p-4 rounded-2xl glass-panel bg-slate-900/95 border border-emerald-500/40 shadow-2xl shadow-emerald-950/50 backdrop-blur-md z-30 transition-all">
                      <div class="flex justify-between items-center pb-2 border-b border-surface-border mb-2">
                        <span class="text-xs font-bold text-white flex items-center space-x-1.5">
                          <i data-lucide="info" class="w-3.5 h-3.5 text-emerald-400"></i>
                          <span>What is Optimality Gap?</span>
                        </span>
                        <span class="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/40">
                          Excellent
                        </span>
                      </div>
                      <p class="text-xs text-slate-300 leading-relaxed mb-2">
                        The Optimality Gap measures how close the quantum optimization result is to the theoretical best possible solution. Lower values indicate higher optimization quality.
                      </p>
                      <p class="text-xs text-slate-300 leading-relaxed">
                        A value of 2.8% means the generated portfolio is extremely close to the optimal solution.
                      </p>
                      <div class="mt-3 pt-2 border-t border-surface-border text-[11px] text-emerald-400 font-medium flex items-center space-x-1">
                        <i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i>
                        <span>✓ High-quality optimization result.</span>
                      </div>
                      <div class="absolute top-full right-6 sm:right-auto sm:left-6 -mt-1 w-3 h-3 bg-slate-900 border-r border-b border-emerald-500/40 rotate-45"></div>
                    </div>
                  </div>

                </div>
              </div>

              <div class="lg:col-span-5">
                <div class="rounded-2xl glass-card p-6 border border-cyan-500/20 space-y-4">
                  <div class="flex justify-between items-center border-b border-surface-border pb-3">
                    <span class="text-xs font-mono font-semibold text-slate-300">QAOA Circuit Gate Flow</span>
                    <span class="px-2 py-0.5 rounded text-[10px] font-mono bg-cyan-500/20 text-cyan-300">p = 2 Layers</span>
                  </div>
                  <div class="space-y-3 font-mono text-xs">
                    ${['AAPL', 'MSFT', 'NVDA', 'GOOGL', 'AMZN'].map((t, idx) => `
                      <div class="flex items-center space-x-2">
                        <span class="w-12 text-slate-400 font-bold">${t}</span>
                        <div class="flex-1 flex items-center space-x-1 overflow-hidden text-[10px]">
                          <span class="px-1.5 py-0.5 bg-blue-900/50 text-blue-300 rounded border border-blue-700/50">H</span>
                          <span class="text-slate-600">─</span>
                          <span class="px-1.5 py-0.5 bg-purple-900/50 text-purple-300 rounded border border-purple-700/50">RZ(γ)</span>
                          <span class="text-slate-600">─</span>
                          <span class="px-1.5 py-0.5 bg-cyan-900/50 text-cyan-300 rounded border border-cyan-700/50">CX</span>
                          <span class="text-slate-600">─</span>
                          <span class="px-1.5 py-0.5 bg-amber-900/50 text-amber-300 rounded border border-amber-700/50">RX(β)</span>
                        </div>
                      </div>
                    `).join('')}
                  </div>
                  <div class="p-3 rounded-xl bg-slate-950/60 border border-surface-border text-xs flex justify-between text-slate-300">
                    <span>Optimal Selected:</span>
                    <span class="font-mono text-emerald-400 font-semibold">AAPL • NVDA • GOOGL</span>
                  </div>
                </div>
              </div>
            </div>
          </section>
        </div>
      `;
    }

    // OPTIMIZER PAGE
    function renderOptimizer(container) {
      container.innerHTML = `
        <div class="space-y-8 max-w-4xl mx-auto">
          <div class="glass-panel p-6 sm:p-8 rounded-3xl space-y-6 border border-surface-border">
            <div class="flex justify-between items-center border-b border-surface-border pb-4">
              <div>
                <h1 class="text-2xl font-bold text-white flex items-center space-x-2">
                  <i data-lucide="sliders" class="w-6 h-6 text-cyan-400"></i>
                  <span>Configure Quantum QAOA Optimizer</span>
                </h1>
                <p class="text-xs text-slate-400 mt-1">Set parameters for Qiskit statevector simulation and classical benchmark.</p>
              </div>
              <button onclick="runOptimization()" id="run-btn" class="flex items-center space-x-2 px-6 py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-bold text-sm shadow-lg shadow-cyan-500/20 hover:opacity-90">
                <i data-lucide="play" class="w-4 h-4 fill-white"></i>
                <span>Run Optimization</span>
              </button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div class="space-y-4">
                <div>
                  <label class="text-xs font-semibold text-slate-300 block mb-1">Investment Capital ($)</label>
                  <input type="number" id="capital-input" value="${investmentAmount}" onchange="investmentAmount=Number(this.value)" class="w-full bg-slate-900 border border-surface-border rounded-xl px-3 py-2 text-xs font-mono text-white focus:outline-none focus:border-cyan-500"/>
                </div>

                <div>
                  <label class="text-xs font-semibold text-slate-300 flex justify-between mb-1">
                    <span>Stock Selection Constraint (K)</span>
                    <span class="font-mono text-purple-400" id="k-label">${budgetK} Stocks</span>
                  </label>
                  <input type="range" min="1" max="${selectedTickers.length}" value="${budgetK}" oninput="budgetK=Number(this.value); document.getElementById('k-label').innerText=this.value+' Stocks'" class="w-full accent-purple-500 h-2 bg-slate-800 rounded-lg cursor-pointer"/>
                </div>

                <div>
                  <label class="text-xs font-semibold text-slate-300 flex justify-between mb-1">
                    <span>Risk Aversion (λ)</span>
                    <span class="font-mono text-cyan-400" id="risk-label">${riskFactor.toFixed(2)}</span>
                  </label>
                  <input type="range" min="0" max="1" step="0.05" value="${riskFactor}" oninput="riskFactor=Number(this.value); document.getElementById('risk-label').innerText=Number(this.value).toFixed(2)" class="w-full accent-cyan-500 h-2 bg-slate-800 rounded-lg cursor-pointer"/>
                </div>

                <div>
                  <label class="text-xs font-semibold text-slate-300 block mb-1">QAOA Circuit Layers (p)</label>
                  <div class="flex space-x-2">
                    ${[1,2,3,4,5].map(p => `
                      <button onclick="pLayers=${p}; renderOptimizer(document.getElementById('app-content'));" class="flex-1 py-1.5 rounded-lg text-xs font-mono font-semibold ${pLayers===p?'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40':'bg-slate-900 text-slate-400 border border-surface-border'}">
                        p=${p}
                      </button>
                    `).join('')}
                  </div>
                </div>

    function togglePlayCircuitAnimation() {
      const btn = document.getElementById('play-circuit-btn');
      const box = document.getElementById('narration-text');
      const badge = document.getElementById('narration-step-badge');

      if (isPlayingCircuit) {
        clearInterval(circuitPlaybackTimer);
        isPlayingCircuit = false;
        if (btn) btn.innerHTML = `<i data-lucide="play" class="w-4 h-4 fill-white"></i><span>Play Circuit</span>`;
        if (box) box.innerText = 'Playback paused.';
        if (badge) badge.innerText = 'Paused';
        lucide.createIcons();
        return;
      }

      isPlayingCircuit = true;
      if (btn) btn.innerHTML = `<i data-lucide="pause" class="w-4 h-4 fill-white"></i><span>Pause</span>`;
      
      const steps = [
        { stage: 1, text: 'H creates superposition across all stock qubits.', badge: 'Step 1/5: Superposition' },
        { stage: 2, text: 'RZ encodes portfolio cost, return vectors, and covariance risk.', badge: 'Step 2/5: Cost H' },
        { stage: 3, text: 'CNOT creates entanglement between correlated stock assets.', badge: 'Step 3/5: Entanglement' },
        { stage: 4, text: 'RX explores new solution spaces and prevents local traps.', badge: 'Step 4/5: Mixer H' },
        { stage: 5, text: 'Measurement returns the optimized portfolio bitstring.', badge: 'Step 5/5: Measurement' }
      ];

      let currentStep = 0;

      circuitPlaybackTimer = setInterval(() => {
        // Highlight active stage
        document.querySelectorAll('.gate-box').forEach(el => {
          el.classList.remove('ring-2', 'ring-cyan-400', 'scale-105');
        });

        if (currentStep < steps.length) {
          const stepObj = steps[currentStep];
          if (box) box.innerText = stepObj.text;
          if (badge) badge.innerText = stepObj.badge;

          document.querySelectorAll(`.gate-box[data-stage="${stepObj.stage}"]`).forEach(el => {
            el.classList.add('ring-2', 'ring-cyan-400', 'scale-105');
          });

          currentStep++;
        } else {
          clearInterval(circuitPlaybackTimer);
          isPlayingCircuit = false;
          if (btn) btn.innerHTML = `<i data-lucide="play" class="w-4 h-4 fill-white"></i><span>Replay</span>`;
          if (box) box.innerText = 'Optimization Complete! Valid portfolio sampled.';
          if (badge) badge.innerText = 'Complete';
          lucide.createIcons();
        }
      }, 1500);

      lucide.createIcons();
    }

            <div class="p-6 rounded-3xl glass-panel border border-amber-500/30 space-y-4">
              <h3 class="text-lg font-bold text-white">What is QAOA?</h3>
              <p class="text-sm text-slate-300 leading-relaxed">
                The Quantum Approximate Optimization Algorithm (QAOA) is a hybrid quantum-classical algorithm designed to solve complex optimization problems. Instead of checking one portfolio at a time, QAOA efficiently explores many possible portfolio combinations and helps identify high-quality investment allocations.
              </p>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                <div class="p-4 rounded-2xl bg-slate-900/60 border border-surface-border space-y-1">

                  <p class="text-xs text-slate-400 leading-relaxed">Combines quantum circuit statevector preparation with classical optimizers (like COBYLA) to iteratively update variational parameters.</p>
                </div>
                <div class="p-4 rounded-2xl bg-slate-900/60 border border-surface-border space-y-1">
                  <h4 class="text-xs font-bold text-purple-400 uppercase">QUBO Formulation</h4>
                  <p class="text-xs text-slate-400 leading-relaxed">Translates stock selection, return targets, covariance risks, and budget constraints into a Quadratic Unconstrained Binary Optimization model.</p>
                </div>
                <div class="p-4 rounded-2xl bg-slate-900/60 border border-surface-border space-y-1">
                  <h4 class="text-xs font-bold text-blue-400 uppercase">Ising Hamiltonian Mapping</h4>
                  <p class="text-xs text-slate-400 leading-relaxed">Converts binary variables into quantum spin operators ($Z_i$) where energy levels correspond directly to portfolio costs.</p>
                </div>
                <div class="p-4 rounded-2xl bg-slate-900/60 border border-surface-border space-y-1">
                  <h4 class="text-xs font-bold text-emerald-400 uppercase">Quantum Circuit Execution & Parameter Optimization</h4>
                  <p class="text-xs text-slate-400 leading-relaxed">Alternates Cost and Mixer layers ($p$ layers) using rotation angles ($\gamma$ and $\beta$) to guide the quantum state toward high-return, low-risk portfolio bitstrings.</p>
                </div>
              </div>
